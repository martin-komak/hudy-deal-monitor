site: https://www.hudysport.sk
brands:
  - Mammut
  - Columbia
  - La Sportiva
  - The North Face
min_discount_percent: 50
clothing_sizes: [XXL, 2XL]
shoe_sizes: ['45', '45.0', '45 1/3', '45⅓', '45.5', '46', '46.0']
# Seeds: add real HUDY category/sale URLs you have checked in a browser.
seed_urls:
  - https://www.hudysport.sk/vypredaj-okrajovych-velkosti
max_pages_per_run: 35
max_sitemap_urls: 150
request_delay_seconds: 3
request_timeout_seconds: 20
max_retries: 2
max_price_age_hours: 48
alert_on_new_low: true
# Optional: exact competitor product URLs, manually verified to be identical variants.
# The monitor NEVER guesses competitors by fuzzy product name.
competitors:
  # 'https://www.hudysport.sk/example-product':
  #   - url: 'https://www.example.sk/exact-same-product'
  #     name: 'Example shop'
  #     verified_same_variant: true
  #     size: 'XXL'
